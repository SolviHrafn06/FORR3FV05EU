<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Anakin's Lightsaber</title>
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; overflow: hidden; background: #080c14; color: #e8edf7; font: 14px/1.5 system-ui, sans-serif; }
		#scene-container { position: relative; flex: 1; min-height: 0; }
		canvas { display: block; width: 100%; height: 100%; touch-action: none; }
		.title { position: absolute; top: 24px; left: 28px; pointer-events: none; z-index: 1; }
		.eyebrow { margin: 0 0 5px; color: #83a9d8; font-size: 10px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); font-weight: 500; letter-spacing: -.04em; }
		#blade-status { display: block; margin-top: 8px; color: #aabbd0; font-size: 12px; }
		.toolbar { flex-shrink: 0; padding: 16px 24px 12px; border-top: 1px solid #202a3b; background: #101621; }
		.control-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
		button, .download-link { padding: 10px 16px; border: 1px solid #35445c; border-radius: 7px; background: #182235; color: #e8edf7; font: inherit; cursor: pointer; text-decoration: none; }
		button:hover, .download-link:hover { border-color: #83b5ff; }
		button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #9ec8ff; outline-offset: 3px; }
		button:disabled { opacity: .45; cursor: wait; }
		#power-button { min-width: 140px; background: #2767ba; border-color: #5e9de9; font-weight: 600; }
		#power-button[aria-pressed="true"] { background: #1d3a61; }
		.length-control { display: flex; gap: 10px; align-items: center; margin: 0 10px; color: #b2c1d6; font-size: 12px; }
		input[type="range"] { width: clamp(100px, 15vw, 180px); accent-color: #7db8ff; cursor: pointer; }
		.help { margin: 12px 0 0; color: #7e90a9; text-align: center; font-size: 12px; }
		.credit { flex-shrink: 0; padding: 9px 20px; color: #70829b; font-size: 11px; text-align: center; }
		.credit a { color: #9baec8; }
		@media (max-width: 620px) { .title { top: 16px; left: 18px; } .toolbar { padding: 12px; } button, .download-link { padding: 9px 11px; font-size: 12px; } .length-control { width: 100%; justify-content: center; margin: 4px 0 0; order: 2; } input[type="range"] { width: 170px; } .help { font-size: 10px; } }
	</style>
	<script type="importmap">
		{"imports":{"three":"./public/vendor/three/build/three.module.js","three/addons/":"./public/vendor/three/examples/jsm/"}}
	</script>
</head>
<body>
	<main id="scene-container">
		<div class="title">
			<p class="eyebrow">Episode III</p>
			<h1>Anakin's lightsaber</h1>
			<span id="blade-status" role="status">Loading lightsaber...</span>
		</div>
	</main>
	<div class="toolbar">
		<div class="control-row">
			<button id="power-button" type="button" aria-pressed="false" disabled>Loading...</button>
			<button id="hilt-view" type="button" disabled>Inspect hilt</button>
			<button id="full-view" type="button" disabled>Full saber</button>
			<label class="length-control">Blade length <input id="blade-length" type="range" min="0" max="100" value="0" aria-label="Blade length" disabled></label>
			<a class="download-link" href="./public/anakin-episode3-animated.glb" download>Download model</a>
		</div>
		<p class="help">Click the red switch or press Space to ignite. Drag to orbit. Scroll to zoom.</p>
	</div>
	<aside class="credit">
		Hilt: <a href="https://sketchfab.com/3d-models/anakin-lightsaber-8d248183c9ae4a5e904862db0db83dc7" target="_blank" rel="noopener noreferrer">Anakin Lightsaber</a>
		by <a href="https://sketchfab.com/Khafesus" target="_blank" rel="noopener noreferrer">Khafesus</a> &middot;
		<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> &middot; Adapted with a blue blade and ignition animations
	</aside>
	<script type="module" src="./script.js"></script>
</body>
</html>
